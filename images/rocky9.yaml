- imagename: rocky-linux-9
  types:
    - qcow2

  elements:
    - rocky-container
    - vm
    - block-device-efi
    - cloud-init
    - cloud-init-datasources
    - cloud-init-growpart
    - dhcp-all-interfaces
    - enable-serial-console
    - manifests
    - package-installs
    - element-manifest

  environment:
    DIB_RELEASE: "9"

    # Only probe OpenStack-compatible metadata sources.
    DIB_CLOUD_INIT_DATASOURCES: "ConfigDrive, OpenStack"

    # Verify this against your actual block-device layout.
    DIB_CLOUD_INIT_GROWPART_DEVICES: "/dev/vda4"

    ELEMENTS_PATH: "./elements"

    # Keep manifests outside the image as build artifacts too.
    DIB_MANIFEST_SAVE_DIR: "./artifacts/rocky9-openstack.d"
