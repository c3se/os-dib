- imagename: debian13
  types:
    - qcow2

  elements:
    - debian
    - vm
    - block-device-efi
    - cloud-init
    - cloud-init-datasources
    - cloud-init-growpart
    - dhcp-all-interfaces
    - enable-serial-console
    - manifests
    - package-installs
    - element-manifest
    - debian13-config

  environment:
    DIB_RELEASE: "trixie"

    DIB_CLOUD_INIT_DATASOURCES: "ConfigDrive, OpenStack"

    DIB_CLOUD_INIT_GROWPART_DEVICES: "/dev/vda3"

    ELEMENTS_PATH: "./elements"

    DIB_MANIFEST_SAVE_DIR: "./artifacts/debian13-openstack.d"
