- imagename: fedora44
  types:
    - qcow2

  elements:
    - fedora
    - vm
    - block-device-efi
    - cloud-init
    - cloud-init-datasources
    - cloud-init-growpart
    - dhcp-all-interfaces
    - enable-serial-console
    - selinux-permissive
    - manifests
    - package-installs
    - element-manifest
    - fedora44-config

  environment:
    DIB_RELEASE: "44"

    DIB_CLOUD_INIT_DATASOURCES: "ConfigDrive, OpenStack"

    DIB_CLOUD_INIT_GROWPART_DEVICES: "/dev/vda3"
    ELEMENTS_PATH: "./elements"

    DIB_MANIFEST_SAVE_DIR: "./artifacts/fedora44-openstack.d"
