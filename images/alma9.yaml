- imagename: alma9
  types:
    - qcow2

  elements:
    - almalinux-container
    - vm
    - block-device-efi
    - cloud-init
    - cloud-init-datasources
    - cloud-init-growpart
    - dhcp-all-interfaces
    - enable-serial-console
    - selinux-permissive
    - manifests
    - package-installs
    - element-manifest
    - alma9-config

  environment:
    DIB_RELEASE: "9"

    DIB_CLOUD_INIT_DATASOURCES: "ConfigDrive, OpenStack"

    DIB_CLOUD_INIT_GROWPART_DEVICES: "/dev/vda3"

    ELEMENTS_PATH: "./elements"

    DIB_MANIFEST_SAVE_DIR: "./artifacts/alma9-openstack.d"
